server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location ~ ^/api/v1/(replays|snapshots)(/|$) {
    proxy_pass http://ingestion_api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  # Distributed map-reduce (scatter-gather over all shards + explain): mapReduce on 100k documents
  # takes seconds, so it gets a longer read timeout than ordinary API calls (Content's maxTimeMS is 60 s).
  location /api/v1/distributed/ {
    proxy_pass http://content_api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
  }
  # Full-text search (Elasticsearch, cs-sharded stand). The upstream is resolved per request through
  # Docker DNS, so the same image still starts on stacks without search_api (they answer 502 -> the UI
  # shows the degraded state and falls back to the literal MongoDB search).
  location /api/v1/search {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $search_upstream http://search_api:8000;
    proxy_pass $search_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location /api/v1/ {
    proxy_pass http://content_api:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
