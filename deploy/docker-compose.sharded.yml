# Sharded MongoDB variant of the full stack (plan item 4).
# Separate Compose project and separate volumes: it never touches the cs-coursework volumes.
#   docker compose -f deploy/docker-compose.sharded.yml --env-file .env up --build -d
# UI: http://localhost:${SHARDED_HTTP_PORT:-8082}
# Plan item 7: Elasticsearch full-text search. Content stages `search.index` events in its outbox
# (SEARCH_INDEX_EVENTS=1), search_worker indexes them, search_api serves /api/v1/search.
# Full reindex of the existing corpus (re-runnable, idempotent):
#   docker compose -f deploy/docker-compose.sharded.yml --env-file .env run --rm content_worker python -m content_service.reindex
# High-load runs: `python tools/ops/cs_ops.py --shards 1|3 up` starts this file with one or three shards (separate
# projects and volumes). Cache and oplog are limited on purpose: by default every mongod takes about half of the
# Docker VM memory and up to 5 % of the free disk for its oplog, which does not fit on one laptop.
name: cs-sharded

x-mongod: &mongod
  image: mongo:7.0
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'mongosh --port $${MONGO_PORT} --quiet --eval "db.adminCommand({ping:1}).ok"']
    interval: 5s
    timeout: 5s
    retries: 30

x-app: &app
  build: ..
  restart: unless-stopped
  environment: &environment
    # Content connects only to the mongos router.
    MONGO_URL: mongodb://mongos:27017/
    INGESTION_DATABASE_URL: postgresql://ingestion:ingestion-local@competition_db:5432/ingestion
    BROKER_URL: amqp://coursework:${RABBITMQ_PASSWORD:-local-coursework-rabbit}@rabbitmq:5672/
    OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN in .env}
    CORPUS_DIR: /data
    # Content stages a `search.index` event with every committed batch (transactional outbox).
    SEARCH_INDEX_EVENTS: '1'
    CONTENT_CONCURRENCY: ${CONTENT_CONCURRENCY:-4}
    REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-500}
    REPLAY_MAX_OUTSTANDING: ${REPLAY_MAX_OUTSTANDING:-20000}
    LOAD_DOCUMENTS: ${LOAD_DOCUMENTS:-20000000}
  volumes:
    - corpus_data:/data:ro
  depends_on:
    mongo_sharding_init:
      condition: service_completed_successfully
    ingestion_db_init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    prepare_corpus:
      condition: service_completed_successfully

services:
  cfg1:
    <<: *mongod
    environment: {MONGO_PORT: '27019'}
    command: [mongod, --configsvr, --replSet, cfgRS, --port, '27019', --bind_ip_all, --wiredTigerCacheSizeGB, '0.25', --oplogSize, '990']
    volumes: [cfg1_data:/data/configdb]
  shard1:
    <<: *mongod
    environment: {MONGO_PORT: '27018'}
    command: [mongod, --shardsvr, --replSet, shard1RS, --port, '27018', --bind_ip_all, --wiredTigerCacheSizeGB, '${WT_CACHE_GB:-0.5}', --oplogSize, '${OPLOG_MB:-2048}']
    volumes: [shard1_data:/data/db]
  shard2:
    <<: *mongod
    environment: {MONGO_PORT: '27018'}
    command: [mongod, --shardsvr, --replSet, shard2RS, --port, '27018', --bind_ip_all, --wiredTigerCacheSizeGB, '${WT_CACHE_GB:-0.5}', --oplogSize, '${OPLOG_MB:-2048}']
    volumes: [shard2_data:/data/db]
  shard3:
    <<: *mongod
    environment: {MONGO_PORT: '27018'}
    command: [mongod, --shardsvr, --replSet, shard3RS, --port, '27018', --bind_ip_all, --wiredTigerCacheSizeGB, '${WT_CACHE_GB:-0.5}', --oplogSize, '${OPLOG_MB:-2048}']
    volumes: [shard3_data:/data/db]
  mongos:
    image: mongo:7.0
    restart: unless-stopped
    command: [mongos, --configdb, cfgRS/cfg1:27019, --port, '27017', --bind_ip_all]
    # Shards are awaited by mongo_sharding_init, so a one-shard stand can leave shard2 and shard3 out.
    depends_on:
      cfg1: {condition: service_healthy}
  mongo_sharding_init:
    image: mongo:7.0
    environment:
      SHARDS: ${SHARDS:-shard1 shard2 shard3}
      # MongoDB's default. With 2 MB the balancer reacts to a 6 MB imbalance and would move data during load runs.
      CHUNK_SIZE_MB: ${CHUNK_SIZE_MB:-128}
    volumes:
      - ./mongo-sharded-init.sh:/init.sh:ro
    entrypoint: [bash, /init.sh]
    depends_on:
      - mongos

  competition_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cs2_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-coursework-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d cs2_db']
      interval: 5s
      timeout: 5s
      retries: 20
  ingestion_db_init:
    image: postgres:16-alpine
    environment:
      PGHOST: competition_db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-coursework-postgres}
    volumes:
      - ./postgres-init.sh:/init.sh:ro
    entrypoint: [sh, /init.sh]
    depends_on:
      competition_db:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: coursework
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-coursework-rabbit}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 20
  prepare_corpus:
    build: ..
    command: [python, -m, ingestion_service.infrastructure.datasets.prepare_corpus, --output, /data]
    volumes:
      - corpus_data:/data
  content_api:
    <<: *app
  content_worker:
    <<: *app
    environment: {<<: *environment, CONTENT_ROLES: consume}
    command: [python, -m, content_service.worker]
  # Exactly one dispatcher; content_worker can be scaled without publishing outbox rows several times.
  content_dispatcher:
    <<: *app
    environment: {<<: *environment, CONTENT_ROLES: dispatch}
    command: [python, -m, content_service.worker]
  ingestion_api:
    <<: *app
    command: [uvicorn, ingestion_service.presentation.api.app:app, --host, 0.0.0.0, --port, '8000', --log-config, deploy/config/runtime-logging.yaml]
  ingestion_worker:
    <<: *app
    command: [python, -m, ingestion_service.worker]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Local demo stand only: no auth/TLS so it starts fast and needs no certificates.
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # Docker Desktop disks are often >90% full; do not flip the index to read-only on the stand.
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      action.destructive_requires_name: 'true'
    mem_limit: 1536m
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  search_api:
    build: ..
    restart: unless-stopped
    command: [uvicorn, search_service.presentation.api.app:app, --host, 0.0.0.0, --port, '8000', --log-config, deploy/config/runtime-logging.yaml]
    environment:
      SEARCH_URL: http://elasticsearch:9200
    depends_on:
      elasticsearch: {condition: service_healthy}
  search_worker:
    build: ..
    restart: unless-stopped
    command: [python, -m, search_service.worker]
    environment:
      SEARCH_URL: http://elasticsearch:9200
      BROKER_URL: amqp://coursework:${RABBITMQ_PASSWORD:-local-coursework-rabbit}@rabbitmq:5672/
    depends_on:
      elasticsearch: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  # Measurement runner (not part of the stand): see tools/load/README.md.
  loadtest:
    <<: *app
    profiles: [tools]
    restart: 'no'
    environment: {<<: *environment, SHARDS: '${SHARDS:-shard1 shard2 shard3}'}
    command: [python, tools/load/run.py, --help]
    volumes:
      - ../artifacts/load:/out
  web:
    build: ../frontend
    ports:
      - '127.0.0.1:${SHARDED_HTTP_PORT:-8082}:80'
    depends_on:
      - content_api
      - ingestion_api
      - search_api

# Project-scoped volumes (cs-sharded_*); none of them is shared with cs-coursework.
volumes:
  cfg1_data:
  shard1_data:
  shard2_data:
  shard3_data:
  pg_data:
  rabbit_data:
  corpus_data:
  es_data:
