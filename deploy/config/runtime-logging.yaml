version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s %(levelname)s %(name)s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
loggers:
  # One line per Elasticsearch request (search API, every bulk upsert) is noise; failures surface as exceptions.
  httpx:
    level: WARNING
